apiVersion: batch/v1
kind: Job
metadata:
  name: sample-pod-migrate
  labels:
    app.kubernetes.io/name: sample-pod
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-pod
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/joshua92y/sample-pod
          command:
            - python
            - -c
            - |
              import os, subprocess, sys, time
              from urllib.parse import unquote, urlsplit
              import psycopg
              from psycopg import errors, sql
              try:
                  url = os.environ["DATABASE_OWNER_URL"]
                  db = unquote(urlsplit(url).path.lstrip("/"))
              except Exception as exc:
                  print("db_url_invalid", type(exc).__name__, file=sys.stderr)
                  sys.exit(1)
              raw = os.environ.get("JT_DB_CONNECT_WAIT_SECONDS", "120")
              wait = int(raw) if raw.isascii() and raw.isdigit() else 0
              if not 1 <= wait <= 600:
                  print("db_connect_wait_invalid", file=sys.stderr)
                  sys.exit(1)
              revoke = sql.SQL("REVOKE CONNECT ON DATABASE {} FROM PUBLIC").format(sql.Identifier(db))
              grant = sql.SQL("GRANT CONNECT ON DATABASE {} TO {}, {}").format(sql.Identifier(db), sql.Identifier(db + "_app"), sql.Identifier(db + "_owner"))
              deadline = time.monotonic() + wait
              attempt = 0
              delay = 1
              while True:
                  attempt += 1
                  step = "connect"
                  try:
                      conn = psycopg.connect(url, autocommit=True, connect_timeout=5)
                      step = "boundary"
                      with conn:
                          conn.execute(revoke)
                          conn.execute(grant)
                      break
                  except Exception as exc:
                      error = type(exc).__name__
                      if step == "connect":
                          retry = isinstance(exc, psycopg.OperationalError)
                          failed, retrying = "db_connect_failed", "db_connect_retry"
                      else:
                          retry = isinstance(exc, (psycopg.OperationalError, errors.UndefinedObject))
                          failed, retrying = "db_boundary_failed", "db_boundary_retry"
                      if not retry or time.monotonic() + delay > deadline:
                          print(failed, error, file=sys.stderr)
                          sys.exit(1)
                  print(retrying, error, "attempt=%d" % attempt, flush=True)
                  time.sleep(delay)
                  delay = min(delay * 2, 10)
              sys.exit(subprocess.call([sys.executable, "manage.py", "migrate", "--noinput"]))
          envFrom:
            - secretRef:
                name: sample-pod-migrate
          env:
            - name: JT_SETTINGS_PROFILE
              value: migrate
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pg-ca
              mountPath: /etc/pg
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pg-ca
          secret:
            secretName: pg-main-ca
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-pod
  labels:
    app.kubernetes.io/name: sample-pod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: PLACEHOLDER.joshuatech.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sample-pod
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: sample-pod
                port:
                  name: http
          - path: /session
            pathType: Prefix
            backend:
              service:
                name: sample-pod
                port:
                  name: http
          - path: /sessions
            pathType: Prefix
            backend:
              service:
                name: sample-pod
                port:
                  name: http
          - path: /tenants
            pathType: Prefix
            backend:
              service:
                name: sample-pod
                port:
                  name: http
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-pod-env
  labels:
    app.kubernetes.io/name: sample-pod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dev
  target:
    name: sample-pod-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        DATABASE_URL: 'postgresql://{{ .db_username }}:{{ .db_password }}@pg-main-rw.data.svc:5432/{{ .db_username | trimSuffix "_app" }}?sslmode=verify-full&sslrootcert=/etc/pg/ca.crt'
        KAFKA_PASSWORD: '{{ .kafka_password }}'
        DRAGONFLY_URL: '{{ .dragonfly_url }}'
        AUTHENTIK_ISSUER: '{{ .authentik_issuer }}'
        AUTHENTIK_JWKS_URL: '{{ .authentik_jwks_url }}'
        SENTRY_DSN: '{{ .sentry_dsn }}'
        SECRET_KEY: '{{ .secret_key }}'
  data:
    - secretKey: db_username
      remoteRef:
        key: dev/db/dev_sample_pod/app
        property: username
    - secretKey: db_password
      remoteRef:
        key: dev/db/dev_sample_pod/app
        property: password
    - secretKey: kafka_password
      remoteRef:
        key: dev/kafka/sample-pod
        property: password
    - secretKey: dragonfly_url
      remoteRef:
        key: dev/dragonfly/sample-pod
        property: url
    - secretKey: authentik_issuer
      remoteRef:
        key: dev/authentik/sample-pod
        property: issuer
    - secretKey: authentik_jwks_url
      remoteRef:
        key: dev/authentik/sample-pod
        property: jwks_url
    - secretKey: sentry_dsn
      remoteRef:
        key: dev/sentry/sample-pod
        property: dsn
    - secretKey: secret_key
      remoteRef:
        key: dev/django/sample-pod
        property: secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-pod-migrate
  labels:
    app.kubernetes.io/name: sample-pod
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dev
  target:
    name: sample-pod-migrate
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        DATABASE_OWNER_URL: 'postgresql://{{ .db_username }}:{{ .db_password }}@pg-main-rw.data.svc:5432/{{ .db_username | trimSuffix "_owner" }}?sslmode=verify-full&sslrootcert=/etc/pg/ca.crt'
  data:
