# 합성 렌더 골든(T065) — tests/_render.py의 검사 함수가 "계약을 그대로 만족하는 렌더"에서 위반 0을 내는지 보는 고정 입력.
# 정본: specs/003-platform-foundation/contracts/pod-template.md §런타임 계약 · §기본 테스트 6.
# kustomize build deploy/base 출력의 꼴을 흉내 낸 손 작성 파일이다 — 템플릿(T072)의 실제 매니페스트가 아니다.
# 값은 전부 가짜 · 고정이다(비밀 없음 · 실제 호스트 없음 — pg-main-rw.data.svc는 계약의 svc DNS).
# 마운트 두 꼴을 함께 쓴다: web · celery · migrate는 /etc/pg 디렉터리, relay는 /etc/pg/ca.crt(subPath ca.crt).
# Ingress pathType은 검사 대상이 아니다(계약이 정하지 않음) — 여기서는 /health만 Exact, 나머지는 하위 경로(/session/check 등)가
# 매치되도록 Prefix로 둔다(r1 A-1).
# test_render_helpers.py가 이 문서들을 깊은 복사해 변이를 하나씩 넣고, 그 변이를 맡은 검사만 위반을 내는지 본다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-pod-config
  labels:
    app.kubernetes.io/name: sample-pod
data:
  ACCESS_AUD_ADMIN: placeholder-access-aud-admin
  ACCESS_AUD_M2M: placeholder-access-aud-m2m
  ACCESS_EXPECTED_CN: placeholder-client-id.access
  ADMIN_HOST: ""
  ALLOWED_HOSTS: sample-pod.jt-dev.svc
  AUTH_ACTOR_SUB: ""
---
apiVersion: v1
kind: Service
metadata:
  name: sample-pod
  labels:
    app.kubernetes.io/name: sample-pod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sample-pod
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-pod
  labels:
    app.kubernetes.io/name: sample-pod
    app.kubernetes.io/component: web
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-pod
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-pod
        app.kubernetes.io/component: web
      annotations:
        k8s.grafana.com/scrape: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - platform
      containers:
        - name: web
          image: ghcr.io/joshua92y/sample-pod:placeholder
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: web-metrics
              containerPort: 9100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sample-pod-config
            - secretRef:
                name: sample-pod-env
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pg-ca
              mountPath: /etc/pg
              readOnly: true
        - name: relay
          image: ghcr.io/joshua92y/sample-pod:placeholder
          command:
            - python
            - manage.py
            - outbox_relay
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sample-pod-config
            - secretRef:
                name: sample-pod-env
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pg-ca
              mountPath: /etc/pg/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pg-ca
          secret:
            secretName: pg-main-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-pod-celery
  labels:
    app.kubernetes.io/name: sample-pod
    app.kubernetes.io/component: celery
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-pod
      app.kubernetes.io/component: celery
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-pod
        app.kubernetes.io/component: celery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - platform
      containers:
        - name: celery
          image: ghcr.io/joshua92y/sample-pod:placeholder
          command:
            - celery
            - --app
            - sample_pod
            - worker
            - --beat
            - --schedule
            - /tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: sample-pod-config
            - secretRef:
                name: sample-pod-env
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pg-ca
              mountPath: /etc/pg
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pg-ca
          secret:
            secretName: pg-main-ca
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sample-pod-migrate
  labels:
    app.kubernetes.io/name: sample-pod
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-pod
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/joshua92y/sample-pod:placeholder
          command:
            - python
            - -c
            - |
              import os, subprocess, sys
              import psycopg
              with psycopg.connect(os.environ["DATABASE_OWNER_URL"], autocommit=True) as conn:
                  conn.execute("REVOKE CONNECT ON DATABASE sample_pod FROM PUBLIC")
                  conn.execute("GRANT CONNECT ON DATABASE sample_pod TO sample_pod_app, sample_pod_owner")
              sys.exit(subprocess.call([sys.executable, "manage.py", "migrate", "--noinput"]))
          envFrom:
            - configMapRef:
                name: sample-pod-config
            - secretRef:
                name: sample-pod-migrate
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pg-ca
              mountPath: /etc/pg
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pg-ca
          secret:
            secretName: pg-main-ca
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-pod
  labels:
    app.kubernetes.io/name: sample-pod
spec:
  ingressClassName: traefik
  rules:
    - host: sample-pod.placeholder.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sample-pod
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: sample-pod
                port:
                  name: http
          - path: /session
            pathType: Prefix
            backend:
              service:
                name: sample-pod
                port:
                  name: http
          - path: /sessions
            pathType: Prefix
            backend:
              service:
                name: sample-pod
                port:
                  name: http
          - path: /tenants
            pathType: Prefix
            backend:
              service:
                name: sample-pod
                port:
                  name: http
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-pod-env
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: placeholder-store
  target:
    name: sample-pod-env
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@pg-main-rw.data.svc:5432/{{ .database }}?sslmode=verify-full&sslrootcert=/etc/pg/ca.crt"
  data:
    - secretKey: username
      remoteRef:
        key: placeholder/sample-pod/db-app
        property: username
    - secretKey: password
      remoteRef:
        key: placeholder/sample-pod/db-app
        property: password
    - secretKey: database
      remoteRef:
        key: placeholder/sample-pod/db-app
        property: database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-pod-migrate
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: placeholder-store
  target:
    name: sample-pod-migrate
    template:
      engineVersion: v2
      data:
        DATABASE_OWNER_URL: "postgresql://{{ .username }}:{{ .password }}@pg-main-rw.data.svc:5432/{{ .database }}?sslmode=verify-full&sslrootcert=/etc/pg/ca.crt"
  data:
    - secretKey: username
      remoteRef:
        key: placeholder/sample-pod/db-owner
        property: username
    - secretKey: password
      remoteRef:
        key: placeholder/sample-pod/db-owner
        property: password
    - secretKey: database
      remoteRef:
        key: placeholder/sample-pod/db-owner
        property: database
