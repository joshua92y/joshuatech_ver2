# 합성 렌더 변형 골든(T072) — has_celery=false 생성(has_admin 기본 true)의 kustomize build deploy/base 출력 꼴.
# 정본: specs/003-platform-foundation/contracts/pod-template.md §기본 테스트 6(has_celery=false 렌더) · design/t072-design.md D15 · D20 · D21.
# = fixtures/golden-render.yaml − celery Deployment + CronJob sample-pod-outbox-purge(D15 값 그대로). 나머지 문서는 기본 골든과
# 글자까지 같다 — test_render_helpers.py가 두 파일의 관계를 단언한다(한쪽만 고치면 그 시험이 실패한다). 본보기가 아닌 곳(relay의
# pg-ca subPath 꼴)과 본보기인 migrate Job 스크립트(T072 r2 E7)는 기본 골든 머리 주석 그대로다.
# tests/_render.py 검사를 has_celery=False로 돌리면 위반 0이다. 기본 모드로 돌리면 identification이 실패한다(Deployment 1).
# test_render_helpers.py의 _CRON_TABLE이 이 문서들을 깊은 복사해 변이를 하나씩 넣고, 그 변이를 맡은 검사만 위반을 내는지 본다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-pod-config
  labels:
    app.kubernetes.io/name: sample-pod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  ACCESS_AUD_ADMIN: ""
  ACCESS_AUD_M2M: PLACEHOLDER-SET-IN-OVERLAY
  ACCESS_EXPECTED_CN: PLACEHOLDER-SET-IN-OVERLAY
  ACCESS_TEAM_DOMAIN: joshua-tech.cloudflareaccess.com
  ADMIN_HOST: ""
  ALLOWED_HOSTS: sample-pod.jt-dev.svc
  AUTH_ACTOR_SUB: ""
  AUTHENTIK_AUDIENCE: sample-pod
  ENV: dev
  FORCE_SCRIPT_NAME: ""
  KAFKA_BOOTSTRAP: jt-kafka-kafka-bootstrap.data.svc:9093
  KAFKA_USERNAME: dev-sample-pod
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.1"
---
apiVersion: v1
kind: Service
metadata:
  name: sample-pod
  labels:
    app.kubernetes.io/name: sample-pod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sample-pod
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
