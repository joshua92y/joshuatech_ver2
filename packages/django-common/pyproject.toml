# django-common — Django pod 공용 라이브러리. 현재: 런타임 의존성 + 시험 인프라(T060 · T061 · T062 · T063, test-first)
# + T068 구현(django_common.tenancy · django_common.problem · 관리 명령 check_rls — tests/test_tenancy.py ·
# tests/test_tenancy_contract.py 초록) + T069 구현(django_common.outbox · django_common.kafka · 모델 OutboxEvent ·
# 마이그레이션 0001 · 관리 명령 outbox_relay · outbox_requeue · outbox_purge — tests/test_outbox.py ·
# tests/test_outbox_contract.py · tests/test_event_patterns.py 초록) + T070 구현(django_common.auth — tests/test_auth.py ·
# tests/test_auth_contract.py 초록) + T071 구현(django_common.observability · django_common.health —
# tests/test_observability.py · tests/test_observability_contract.py 초록).
[project]
name = "django-common"
version = "0.0.0"
description = "Shared library for Django pods (skeleton)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.3,<4",
    # outbox 릴레이(idempotent producer)와 relay 지표(9464)는 라이브러리 본체에 속한다(contracts/events.md §릴레이).
    "confluent-kafka>=2.15,<3",
    "prometheus-client>=0.23,<1",
    # 인증 미들웨어(Bearer JWKS · Access JWT 검증)와 거부 목록 조회(Dragonfly)도 라이브러리 본체에 속한다
    # (contracts/identity-admin-api.md §인증 계층 · contracts/denylist.md §조회 규약 · research DJANGO-D9 · D11).
    # PyJWT 하한 2.13 = JWKS fetch 실패 시 캐시 삭제·스킴 미검증 취약점 수정판. testcontainers의 community.redis도
    # import 시 redis를 요구한다(시험 픽스처 dragonfly) — 이 런타임 의존성이 그것을 채운다.
    "PyJWT[crypto]>=2.13,<3",
    "redis[hiredis]>=8.1,<9",
    # 관측(structlog JSON 로그 · request_id 미들웨어 · OTel 트레이스)과 헬스 라우터(Ninja)도 라이브러리 본체에 속한다
    # (contracts/pod-template.md §런타임 계약 로그·트레이스 행 · §django-common 공개 API · research DJANGO-D12 · D13).
    # django-ninja는 라이브러리라 범위로 둔다 — 정확 핀(==1.7.0)은 pod의 몫이다(contracts/identity-admin-api.md 머리).
    # sentry-sdk(configure_sentry · 예외 포착만 — contracts/pod-template.md 「트레이스 · Sentry」 행 · T071 D7): 하한 2.73 =
    # Django 6.1 × Python 3.13이 상류 시험 행렬에 있는 판(2026-10-22). 상한 <3 필수 — 3.x는 send_default_pii ·
    # include_local_variables · event_scrubber를 없애고 data_collection 기본값을 넓힌다(지역 변수 · 본문 기본 수집). extra는
    # 붙이지 않는다(`opentelemetry` extra는 distro · grpc를 끌어온다). 기본 의존(urllib3 · certifi)은 이미 lock에 있다.
    "sentry-sdk>=2.73,<3",
    "structlog>=26.1,<27",
    "django-structlog>=11,<12",
    "opentelemetry-sdk>=1.45,<2",
    # 상한 <0.67(T071 r3 Z6): configure_otel이 계측 미들웨어 클래스의 비공개 속성(_traced_request_attrs ·
    # _sem_conv_opt_in_mode)과 _StabilityMode를 읽는다 — 판 올림은 django-common의 의도한 변경이어야 하고 계약 시험이 확인한다.
    # 생성 pod lock이 검증 안 된 베타를 고르지 못하게 한다(instrumentation · wsgi · util-http · semantic-conventions는 같은 판으로
    # 서로 묶여 있다).
    "opentelemetry-instrumentation-django>=0.66b2,<0.67",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "django-ninja>=1.7,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.14,<5",
    "testcontainers[postgres]>=4.15,<5",
    # out-6이 봉투·data를 packages/events 스키마(JSON Schema Draft 2020-12)로 검증한다.
    "jsonschema>=4.26,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_common"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
# --tb=short(T063 r1 B-3): 긴 트레이스백(기본 auto의 첫·마지막 항목)은 함수 인자를 지금 값으로 찍는다 — psycopg 3.3
# Connection.connect는 인자 conninfo를 비밀번호가 든 접속 문자열로 다시 묶으므로 DB 접속 실패가 비밀번호를 출력한다(실측).
# 디버깅에 긴 트레이스백이 필요하면 명령줄에서 --tb=long을 주되 출력을 공유하지 않는다.
# --show-capture=no(T071 r9 K2): 실패한 시험의 Captured log 칸(pytest 기본 all — 실패 보고마다 캡처 로그 · stdout · stderr를 붙인다)이
# 관측 계약 시험(tests/test_observability_contract.py)이 심은 합성 감시 값을 찍는다 — 그 칸에는 마스킹하지 않은 키 값의 repr와 stdlib
# 메시지 인자가 실린다(pytest 캡처 처리기는 우리 JSON 렌더러를 거치지 않는다 · 실측). 이 설정은 django-common의 모든 시험 모듈에 걸린다.
# 공유 실행(CI 포함 · T071 r10 I2 — 규칙 .claude/rules/django-pod.md §Tests와 같은 원칙): 이 파일이 ini로 골라지게 돌린다
# (packages/django-common에서 돌리거나 그 안의 경로만 준다 — 다른 ini가 골라지면 이 addopts가 빠진다) · python -O · PYTHONOPTIMIZE로
# 돌리지 않는다(관측 계약 모듈은 수집을 거부하고, 그 밖의 맨 assert는 조용히 지워진다) · 실패 출력을 넓히는 옵션(규칙의 목록 —
# -l/--showlocals · --tb=long · --full-trace · no가 아닌 --show-capture · log_cli/--log-cli-level · --log-file/log_file · no가 아닌
# junit_logging)을 더하지 않는다. 그런 옵션은 디버깅 때 로컬에서만 쓰고 그 출력은 공유하지 않는다.
addopts = ["--tb=short", "--show-capture=no"]
# DeprecationWarning을 오류로 바꾸는 범위는 자기 모듈뿐이다(의존 라이브러리의 경고로 스위트가 죽지 않게).
filterwarnings = [
    "error::DeprecationWarning:django_common",
    "error::DeprecationWarning:tests",
]
