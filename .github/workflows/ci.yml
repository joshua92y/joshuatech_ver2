# CI 골격(T002) — FR-037 공급망 강화 정책 반영
# - runs-on: ubuntu-24.04-arm — 운영 노드(OCI Ampere A1)와 이미지/도구가 모두 arm64이므로
#   퍼블릭 arm64 러너에서 같은 아키텍처로 검사한다.
# - 모든 액션은 전체 커밋 SHA로 핀한다(주석의 vX.Y.Z는 사람용 표기).
#   태그→SHA 갱신은 Renovate(config:best-practices의 pinGitHubActionDigests)가 유지한다.
# - 설치는 pnpm install --frozen-lockfile --ignore-scripts · uv sync --locked 만 허용
#   (잠금파일이 정본, 라이프사이클 스크립트 실행 금지).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks는 전체 커밋 히스토리를 스캔한다
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE는 조직(org) 저장소에만 필요 — 개인 저장소이므로 불필요

  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: 의존성 설치(잠금파일 고정 · 스크립트 실행 금지)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          uv sync --locked
      - name: lint 자리(placeholder) — US 단계에서 채움
        run: echo "lint 자리(placeholder) — US 단계에서 채움"

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: 의존성 설치(잠금파일 고정 · 스크립트 실행 금지)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          uv sync --locked
      - name: test 자리(placeholder) — US 단계에서 채움
        run: echo "test 자리(placeholder) — US 단계에서 채움"
