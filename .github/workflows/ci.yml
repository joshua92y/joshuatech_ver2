# CI 골격(T002) — FR-037 공급망 강화 정책 반영
# - runs-on: ubuntu-24.04-arm — 운영 노드(OCI Ampere A1)와 이미지/도구가 모두 arm64이므로
#   퍼블릭 arm64 러너에서 같은 아키텍처로 검사한다.
# - 모든 액션은 전체 커밋 SHA로 핀한다(주석의 vX.Y.Z는 사람용 표기).
#   태그→SHA 갱신은 Renovate(config:best-practices의 pinGitHubActionDigests)가 유지한다.
# - 설치는 pnpm install --frozen-lockfile --ignore-scripts · uv sync --locked 만 허용
#   (잠금파일이 정본, 라이프사이클 스크립트 실행 금지).
# - job kubeconform(T047 M1): pod 배포 매니페스트(생성물의 deploy/base — gitops apps/<pod>/base로 복사된다)를
#   kustomize build → kubeconform -strict로 검사한다(scripts/ci/kubeconform-deploy.sh — 대상이 없으면 "대상 없음"으로 통과).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks는 전체 커밋 히스토리를 스캔한다
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE는 조직(org) 저장소에만 필요 — 개인 저장소이므로 불필요
          # PR 코멘트는 pull-requests: write 권한이 필요 — permissions를 contents: read로
          # 유지하기 위해 코멘트 기능을 끈다(결과는 job 로그·실패 상태로 확인).
          GITLEAKS_ENABLE_COMMENTS: "false"

  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # uv 버전 핀(plan Technical Context: uv 0.12.8). Renovate가 이 version 입력을
          # 추적해 astral-sh/uv 릴리스 기준 bump PR을 연다(automerge 전역 off).
          # 그 PR을 머지할 때는 plan Technical Context의 uv 핀과 uv Docker 이미지 태그
          # (uv:<ver>-python3.13-trixie-slim)를 같은 변경에서 함께 올려 desync를 막는다.
          version: "0.12.8"
      - name: 의존성 설치(잠금파일 고정 · 스크립트 실행 금지)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          uv sync --locked
      - name: lint 자리(placeholder) — US 단계에서 채움
        run: echo "lint 자리(placeholder) — US 단계에서 채움"

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # uv 버전 핀(plan Technical Context: uv 0.12.8). Renovate가 이 version 입력을
          # 추적해 astral-sh/uv 릴리스 기준 bump PR을 연다(automerge 전역 off).
          # 그 PR을 머지할 때는 plan Technical Context의 uv 핀과 uv Docker 이미지 태그
          # (uv:<ver>-python3.13-trixie-slim)를 같은 변경에서 함께 올려 desync를 막는다.
          version: "0.12.8"
      - name: 의존성 설치(잠금파일 고정 · 스크립트 실행 금지)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          uv sync --locked
      - name: test 자리(placeholder) — US 단계에서 채움
        run: echo "test 자리(placeholder) — US 단계에서 채움"

  kubeconform:
    # pod 배포 매니페스트 스키마 검사(T047 M1). 대상 규칙 · 판정 · 경보선(템플릿에 매니페스트가 생겼는데 생성 단계가
    # 연결되지 않으면 실패 — T072가 연결한다)은 scripts/ci/kubeconform-deploy.sh 머리 주석이 정본이다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 뒤 스텝이 저장소의 스크립트를 실행한다 — .git/config에 토큰을 남기지 않는다(push · fetch를 하는 스텝이 없다)
          persist-credentials: false
      - name: 도구 설치 — kustomize · kubeconform(버전 고정 + sha256 대조)
        env:
          # linux arm64 공식 릴리스 자산의 sha256(각 릴리스의 체크섬 파일 값).
          # 버전을 바꾸면 sha256도 함께 — gitops 저장소 validate.yml의 값과 같이 움직인다.
          KUSTOMIZE_VERSION: v5.8.1
          KUSTOMIZE_SHA256: 0953ea3e476f66d6ddfcd911d750f5167b9365aa9491b2326398e289fef2c142
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          dl="$RUNNER_TEMP/dl"
          mkdir -p "$bin" "$dl"
          # fetch <url> <파일 이름> <sha256> — 받은 파일을 sha256으로 대조한다. 맞지 않으면 실패(풀지도 설치하지도 않는다)
          fetch() {
            if [[ ! $3 =~ ^[0-9a-f]{64}$ ]]; then
              printf '::error::%s: sha256 값의 형식이 틀렸다\n' "$2"
              return 1
            fi
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "$dl/$2" "$1"
            printf '%s  %s\n' "$3" "$dl/$2" | sha256sum -c -
          }
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_arm64.tar.gz" kustomize.tar.gz "$KUSTOMIZE_SHA256"
          tar -xzf "$dl/kustomize.tar.gz" -C "$bin" kustomize
          fetch "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz" kubeconform.tar.gz "$KUBECONFORM_SHA256"
          tar -xzf "$dl/kubeconform.tar.gz" -C "$bin" kubeconform
          chmod 0755 "$bin/kustomize" "$bin/kubeconform"
          # 버전 확인 — 설치한 바이너리가 기대 버전이 아니면 실패
          want_got() {
            if [[ $3 != "$2" ]]; then
              printf '::error::%s 버전 불일치: 실제 %q · 기대 %s\n' "$1" "$3" "$2"
              return 1
            fi
            printf '  %-12s %s\n' "$1" "$3"
          }
          want_got kustomize "$KUSTOMIZE_VERSION" "$("$bin/kustomize" version)"
          want_got kubeconform "$KUBECONFORM_VERSION" "$("$bin/kubeconform" -v)"
          # 다음 스텝부터 PATH 맨 앞에 온다(GITHUB_PATH는 앞에 붙인다)
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - name: pod 배포 매니페스트 스키마 검사 — scripts/ci/kubeconform-deploy.sh
        run: bash scripts/ci/kubeconform-deploy.sh
