  kubeconform:
    # pod 배포 매니페스트 스키마 검사(T047 M1). 대상 규칙 · 판정 · 경보선(템플릿에 매니페스트가 생겼는데 생성 단계가
    # 연결되지 않으면 실패 — T072가 연결한다)은 scripts/ci/kubeconform-deploy.sh 머리 주석이 정본이다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 뒤 스텝이 저장소의 스크립트를 실행한다 — .git/config에 토큰을 남기지 않는다(push · fetch를 하는 스텝이 없다)
          persist-credentials: false
      - name: 도구 설치 — kustomize · kubeconform(버전 고정 + sha256 대조)
        env:
          # linux arm64 공식 릴리스 자산의 sha256(각 릴리스의 체크섬 파일 값).
          # 버전을 바꾸면 sha256도 함께 — gitops 저장소 validate.yml의 값과 같이 움직인다.
          KUSTOMIZE_VERSION: v5.8.1
          KUSTOMIZE_SHA256: 0953ea3e476f66d6ddfcd911d750f5167b9365aa9491b2326398e289fef2c142
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          dl="$RUNNER_TEMP/dl"
          mkdir -p "$bin" "$dl"
          # fetch <url> <파일 이름> <sha256> — 받은 파일을 sha256으로 대조한다. 맞지 않으면 실패(풀지도 설치하지도 않는다)
          fetch() {
            if [[ ! $3 =~ ^[0-9a-f]{64}$ ]]; then
              printf '::error::%s: sha256 값의 형식이 틀렸다\n' "$2"
              return 1
            fi
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "$dl/$2" "$1"
            printf '%s  %s\n' "$3" "$dl/$2" | sha256sum -c -
          }
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_arm64.tar.gz" kustomize.tar.gz "$KUSTOMIZE_SHA256"
          tar -xzf "$dl/kustomize.tar.gz" -C "$bin" kustomize
          fetch "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz" kubeconform.tar.gz "$KUBECONFORM_SHA256"
          tar -xzf "$dl/kubeconform.tar.gz" -C "$bin" kubeconform
          chmod 0755 "$bin/kustomize" "$bin/kubeconform"
          # 버전 확인 — 설치한 바이너리가 기대 버전이 아니면 실패
          want_got() {
            if [[ $3 != "$2" ]]; then
              printf '::error::%s 버전 불일치: 실제 %q · 기대 %s\n' "$1" "$3" "$2"
              return 1
            fi
            printf '  %-12s %s\n' "$1" "$3"
          }
          want_got kustomize "$KUSTOMIZE_VERSION" "$("$bin/kustomize" version)"
          want_got kubeconform "$KUBECONFORM_VERSION" "$("$bin/kubeconform" -v)"
          # 다음 스텝부터 PATH 맨 앞에 온다(GITHUB_PATH는 앞에 붙인다)
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - name: pod 배포 매니페스트 스키마 검사 — scripts/ci/kubeconform-deploy.sh
        run: bash scripts/ci/kubeconform-deploy.sh

  events-compat:
    # packages/events 스키마 호환성 게이트(T067 · 머리 주석 「job events-compat · events-test」). 이 job은 PR 코드를 돌리지 않는다 —
    # 스텝은 Node 설치(체크아웃 전 · 빈 작업 공간 · 캐시 없음) → 체크아웃 → 게이트 스크립트이고, 체크아웃 뒤에 도는 것은 게이트 스크립트
    # 하나뿐이다(같은 러너에서 게이트보다 먼저 도는 PR 코드는 게이트를 바꿀 수 있다 · 예외는 부트스트랩뿐 — 게이트 스텝 안에서 이 변경의
    # 검사기가 돌지만 기준이 비어 지킬 것이 없다). Node 버전은 이 job의 고정값(node-version)이고 .node-version과 같아야 한다 — CI에서는
    # job events-test의 schemas.test.mjs sch-23이, 로컬에서는 하네스 st-5 · st-15가 지킨다(갈라진 채 검사기가 새 Node API를 쓰면 머지 뒤
    # 게이트 교착). 빈 작업 공간은 GitHub 호스티드 러너(job마다 새 VM) 전제다 — 작업 공간을 재사용하는 자체 호스티드 러너면 무효다.
    # 의존성 설치와 테스트는 job events-test가 한다. 기준 · 커밋 트리 읽기 · 변경 쪽(CI = HEAD 커밋 + 작업 트리 바이트 일치) · 다음 기준의
    # 모양 · 기준 쪽 검사기 · 부트스트랩 · 출력 계약 · 종료 코드 규칙은 scripts/ci/events-compat.sh 머리 주석이 정본이다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      # Node 설치가 체크아웃보다 먼저다 — setup-node(v6.5.0)는 설치 뒤 작업 공간을 cwd로 node · npm · yarn --version을 돌리고
      # (「Environment details」), 러너의 Yarn 1은 --version을 처리하기 전에 cwd와 그 위 디렉터리의 .yarnrc · .yarnrc.yml에 적힌 yarnPath를
      # 실행한다 — 체크아웃 뒤라면 게이트 파일을 하나도 바꾸지 않은 PR(.yarnrc.yml + 스크립트 하나)의 코드가 게이트 앞에 돈다. 이 스텝에서
      # 작업 공간은 비어 있다(GitHub 호스티드 러너 — job마다 새 VM. 작업 공간을 재사용하는 자체 호스티드 러너면 이전 job이 체크아웃한 PR
      # 파일을 이 탐침이 실행할 수 있어 이 보호는 무효다).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # 버전은 고정값이다 — .node-version을 읽을 체크아웃이 아직 없다(node-version-file을 쓰지 않는다). 값은 .node-version과
          # 같아야 한다 — CI에서는 job events-test의 packages/events/tests/schemas.test.mjs sch-23이(핀은 이 스텝 키 깊이의 with: 아래
          # 줄이어야 한다 — 같은 job의 다른 스텝이나 env: 같은 다른 키 아래로 옮긴 핀은 버전 입력이 아니다. 또 이 job 블록 전체에서
          # setup-node를 가리키는 줄은 앞의 `- ` 유무 · 따옴표 · 대소문자 · 흐름 매핑 꼴과 상관없이 — 줄 단위 드리프트 검사 · 의도적으로
          # 꼬아 쓴 ci.yml은 코드 소유자 리뷰 — 이 스텝 머리 하나, node-version 키 줄은 이 핀 하나, node-version-file 키 줄은 0이어야 하고(꼴이
          # 다른 둘째 setup-node 스텝도 PATH 앞에 제 Node를 놓는다), 이 파일 원문에 NEL · LS · PS가 없어야 한다 — 파서마다 줄바꿈 여부가
          # 달라 블록 경계가 갈린다), 로컬에서는 tests/scripts/events-compat.tests.ps1 st-5 · st-15가(스텝 구성은 st-3이) 지킨다(갈라진 채
          # 검사기가 새 Node API를 쓰면 머지 뒤 게이트 교착)
          node-version: '24'
          # 캐시를 복원하지 않는다 — cache 입력 없음 + package-manager-cache: false. setup-node는 cache가 없어도 체크아웃의
          # package.json(devEngines.packageManager · packageManager)이 npm을 가리키면 자동 캐시를 켜고 복원 경로는 체크아웃의 .npmrc가
          # 고른다 — 같은 PR의 이전 실행이 저장한 파일(스키마 · 게이트 스크립트)이 게이트 앞에 풀린다. 체크아웃 전이라 읽을 package.json이
          # 없어도 심층 방어로 둔다
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 기준 커밋(PR = HEAD^1 · push = before)의 스키마와 검사기를 git으로 꺼낸다 — 전체 이력이 필요하다.
          # PR 이벤트에서는 merge 커밋(첫째 부모 = base 끝 · 둘째 부모 = PR head)이 HEAD다
          fetch-depth: 0
          # 뒤 스텝은 push · fetch를 하지 않는다 — .git/config에 토큰을 남기지 않는다
          persist-credentials: false
      # 체크아웃 뒤에는 이 게이트 스텝 하나뿐이다(액션 없음 — tests/scripts/events-compat.tests.ps1 st-3c가 지킨다)
      - name: 스키마 호환성 검사(기준 커밋 ↔ 이 체크아웃) — scripts/ci/events-compat.sh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/events-compat.sh

  events-test:
    # packages/events 스키마 · 검사기 테스트(vitest — T064 · T067). PR 코드를 도는 job이다 — 의존성 설치 · 테스트 · 테스트가 import하는
    # PR의 검사기 · package.json 스크립트. 게이트(events-compat)와 job을 나눈 것은 PR 코드가 같은 러너에서 게이트보다 먼저 돌아 게이트
    # 스크립트 · git 객체 · 속성 · 다음 스텝의 환경을 바꾸지 못하게 하려는 것이다. 토큰 · 비밀을 run 스텝에 넘기지 않는다 — 액션의 기본
    # token 입력(contents: read)과 캐시 토큰은 체크아웃 뒤 setup-node 탐침이 실행하는 PR 코드가 물려받을 수 있다(게이트와는 다른 VM · PR
    # 범위 캐시라 게이트 무결성과는 무관). 검사기를 더 엄격하게 하거나 잘못 고친 변경과 게이트 Node 고정값의 드리프트를 머지 전에 잡는
    # 곳도 이 job이다(머리 주석의 한계 — sch-14 패키지 밖 사본 · sch-21 · sch-9 · sch-23, 이 job이 그 시험을 실제로 돌릴 때만). 패키지 밖
    # 사본은 NODE_PATH · NODE_OPTIONS를 지운 env로 돈다 — 아래 테스트 스텝은 pnpm의 vitest 실행 shim을 거치고, 그 shim이 NODE_PATH에
    # .pnpm/node_modules(ajv가 호이스트된 곳)를 넣는다. 그 env에서 사본 위치가 ajv를 해석하지 못함은 sch-24가 먼저 확인한다. 이 방어는
    # 시험 실행 경로(시험 파일 · packages/events/package.json의 test 스크립트 · vitest 설정 · 루트 pnpm-workspace.yaml · package.json ·
    # pnpm-lock.yaml · .npmrc(pnpm node-options 등) · .pnpmfile.cjs 등 events-test가 읽는 pnpm · vitest 설정과 훅 파일 — events-test는 PR
    # 코드를 도는 job이라 이 목록은 닫힌 목록이 아니다)를 바꾸는 변경(앞선 PR 포함)으로 꺼질 수 있다. 교착 방어(sch-9 · sch-14 · sch-21 ·
    # sch-23 · sch-24)가 이 job에 기대므로 required check 지정과 그 경로의 코드 소유자 리뷰(머리 주석의 운영자 인계 — 루트 .npmrc ·
    # .pnpmfile.cjs 포함)를 운영자에게 인계한다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 뒤 스텝이 PR 코드를 돌린다 — .git/config에 토큰을 남기지 않는다(push · fetch를 하는 스텝이 없다)
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - name: 의존성 설치(잠금파일 고정 · 스크립트 실행 금지)
        run: pnpm install --frozen-lockfile --ignore-scripts
      # --fail-if-no-match: 걸러 낸 프로젝트가 없으면 pnpm은 exit 0으로 끝난다 — 워크스페이스(루트 pnpm-workspace.yaml)에서 packages/events를
      # 빼는 변경이 시험 0개의 빈 통과가 되지 않게 한다(머리 주석의 한계 — 시험 실행 경로)
      - name: 스키마 · 검사기 테스트(vitest)
        run: pnpm --filter @jt/events --fail-if-no-match test
