# uv 워크스페이스 루트(가상 루트 — 그 자체는 파이썬 패키지가 아님)
# Python/uv 멤버만 여기 선언한다. Node 패키지는 pnpm-workspace.yaml 참조.
[tool.uv.workspace]
members = ["packages/django-common"]
# 생성 pod(apps/*)는 독립 uv 프로젝트라 워크스페이스 멤버가 아니다 — 자기 uv.lock은 copier `_tasks: uv lock`이 쓰고
# django-common은 path 소스로 받는다(contracts/pod-template.md · 규칙 django-pod.md). templates/** 도 멤버가 아니다 —
# copier 템플릿의 pyproject는 jinja 템플릿이라 uv가 절대 해석하면 안 되고, 하네스(templates/django-pod)는 자기
# pyproject · uv.lock을 가진 독립 프로젝트다(T001 리뷰 gotcha; T015에서 스텁 제거).
exclude = ["apps/*", "templates/*"]
